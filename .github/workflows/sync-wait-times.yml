name: Sync wait times

on:
  schedule:
    # Every 5 minutes — keeps Supabase filled for daily charts
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync Epic Universe wait times
        run: |
          status=$(curl -sS --retry 3 --retry-delay 15 --retry-all-errors \
            -o /tmp/sync-response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://queueverse.vercel.app/api/cron/sync-wait-times")
          echo "HTTP status: $status"
          cat /tmp/sync-response.json
          test "$status" = "200"
