name: Sync wait times (offset backup)

# Runs 2 minutes after the primary workflow to catch missed GitHub schedule slots
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: wait-time-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync Epic Universe wait times (backup)
        run: |
          status=$(curl -sS --retry 3 --retry-delay 15 --retry-all-errors \
            -o /tmp/sync-response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://queueverse.vercel.app/api/cron/sync-wait-times")
          echo "HTTP status: $status"
          cat /tmp/sync-response.json
          test "$status" = "200"
